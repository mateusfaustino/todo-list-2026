<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <!-- Cabeçalho principal da aplicação -->
    <header class="page-header">
        <div class="container header-content">
            <div>
                <p class="eyebrow">Manipulação de DOM e estados</p>
                <h1>Gerenciador de Tarefas</h1>
                <p class="page-description">
                    Exemplo de interface para demonstrar estados visuais controlados por
                    <strong>data attributes</strong>.
                </p>
            </div>

            <a class="btn btn-primary create-task-link" href="./create.html" aria-label="Criar nova tarefa">
                Criar Tarefa
            </a>
        </div>
    </header>

    <main>
        <section class="task-section" aria-labelledby="task-list-title">
            <div class="container">
                <div class="section-header">
                    <div>
                        <p class="section-eyebrow">Lista de tarefas</p>
                        <h2 id="task-list-title">Minhas tarefas</h2>
                    </div>
                </div>

                <!-- Lista semântica de tarefas -->
                <div
                    class="task-list"
                    role="list"
                    aria-label="Lista de tarefas cadastradas"
                    id="task-list"
                >
                    

                </div>

                <div class="section-footer">
                    <a class="btn btn-primary create-task-link footer-link" href="./create.html" aria-label="Criar nova tarefa">
                        Criar Tarefa
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
<script src="./js/helpers.js"></script>
<script src="./js/index.js"></script>
</html>
